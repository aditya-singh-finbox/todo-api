services:

  # ==================================
  # PostgreSQL
  # ==================================

  postgres:
    image: postgres:16
    container_name: todo-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==================================
  # Go Backend
  # ==================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: todo-backend

    restart: always

    environment:
      PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: todo

      JWT_SECRET: my_super_secret_key_change_this

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy


  # ==================================
  # React Frontend
  # ==================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: todo-frontend

    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data: